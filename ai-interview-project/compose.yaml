services:
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set your public domain}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      PORT: "5000"
      DEV_RELOAD: "false"
      VOICE_CHECK_ENABLED: "false"
      ALLOWED_ORIGINS: https://${SITE_ADDRESS}
      DB_HOST: db
      DB_NAME: ai_interview_db
      DB_USER: interview_app
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set a database password}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_interview_db
      MYSQL_USER: interview_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a root password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/proctoring_migration.sql:/docker-entrypoint-initdb.d/02-proctoring.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
  caddy_data:
  caddy_config:
